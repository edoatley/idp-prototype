name: apply

# On merge to main, apply the stacks that changed. Authenticates to GCP with
# keyless Workload Identity Federation (no SA keys). This is the write path that
# provisions real infrastructure.
on:
  push:
    branches: [main]
    paths:
      - "idp-gitops/stacks/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write # to post the apply audit-trail comment back on the PR

# Serialise applies so two merges can't race on shared state.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        run: |
          base='${{ github.event.before }}'
          # First push to a branch reports an all-zero "before"; fall back to the parent.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          mapfile -t dirs < <(git diff --name-only "$base" "$GITHUB_SHA" -- 'idp-gitops/stacks/' \
            | awk -F/ 'NF>=4 {print $1"/"$2"/"$3"/"$4}' | sort -u)
          stacks=()
          for d in "${dirs[@]}"; do
            if [ -f "$d/main.tf" ]; then stacks+=("$d"); fi   # ignore deletions (destroy is a separate pipeline)
          done
          if [ ${#stacks[@]} -eq 0 ]; then
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
          else
            echo "stacks=$(printf '%s\n' "${stacks[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed stacks: ${stacks[*]:-none}"

  apply:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Sequential applies (one shared state bucket); keep it simple and ordered.
      max-parallel: 1
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform -chdir=${{ matrix.stack }} init -input=false

      - name: terraform apply
        id: apply
        run: |
          set +e
          terraform -chdir=${{ matrix.stack }} apply -auto-approve -input=false 2>&1 | tee /tmp/apply.txt
          code=${PIPESTATUS[0]}
          terraform -chdir=${{ matrix.stack }} output -json > /tmp/outputs.json 2>/dev/null || echo '{}' > /tmp/outputs.json
          exit $code

      - name: Comment apply result on the originating PR
        if: always()
        # Closes the audit loop: apply runs on push to main (not the PR), so we
        # find the PR the merge commit came from and post the outcome + outputs +
        # run link back onto it. The Actions run and GCP audit logs remain the
        # authoritative trail; this just surfaces it where the request was made.
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stack = '${{ matrix.stack }}';
            const outcome = '${{ steps.apply.outcome }}';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const pr = prs.find((p) => p.merged_at) ?? prs[0];
            if (!pr) { core.info('No PR associated with this commit; skipping comment.'); return; }

            let outputs = {};
            try { outputs = JSON.parse(fs.readFileSync('/tmp/outputs.json', 'utf8')); } catch (e) {}
            const bucket = outputs.bucket_name?.value ?? '(n/a)';
            const label = outcome === 'success' ? '✅ Applied' : '❌ Apply failed';
            const marker = `<!-- tf-apply:${stack} -->`;
            const body = [
              marker,
              `### ${label} — \`${stack}\``,
              outcome === 'success'
                ? `Provisioned **\`${bucket}\`** via Workload Identity Federation.`
                : `Apply failed — see the run for details.`,
              '',
              `- Outputs: \`${JSON.stringify(outputs)}\``,
              `- [Apply run](${runUrl}) · commit \`${context.sha.slice(0, 7)}\` · ${new Date().toISOString()}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
