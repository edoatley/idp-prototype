name: apply

# On merge to main, apply the stacks that changed. Authenticates to GCP with
# keyless Workload Identity Federation (no SA keys). This is the write path that
# provisions real infrastructure.
on:
  push:
    branches: [main]
    paths:
      - "idp-gitops/stacks/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write # to post the apply audit-trail comment back on the PR

# Serialise applies so two merges can't race on shared state.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        run: .github/scripts/detect-stacks.sh --changed --base '${{ github.event.before }}' --head "$GITHUB_SHA"

  apply:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Sequential applies (one shared state bucket); keep it simple and ordered.
      max-parallel: 1
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform -chdir=${{ matrix.stack }} init -input=false

      - name: terraform apply
        id: apply
        run: |
          set +e
          terraform -chdir=${{ matrix.stack }} apply -auto-approve -input=false 2>&1 | tee /tmp/apply.txt
          code=${PIPESTATUS[0]}
          terraform -chdir=${{ matrix.stack }} output -json > /tmp/outputs.json 2>/dev/null || echo '{}' > /tmp/outputs.json
          exit "$code"

      - name: Comment apply result on the originating PR
        if: always()
        # Closes the audit loop: apply runs on push to main (not the PR), so we
        # find the PR the merge commit came from and post the outcome + outputs +
        # run link back onto it. The Actions run and GCP audit logs remain the
        # authoritative trail; this just surfaces it where the request was made.
        uses: actions/github-script@v7
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-apply.js`);
            await report({ github, context, core,
              stack: '${{ matrix.stack }}',
              outcome: '${{ steps.apply.outcome }}' });

