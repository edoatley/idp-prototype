name: node-checks

# Credential-free checks for the platform's Node surfaces: the shared domain
# (idp-core) and the surfaces built on it (idp-portal, and later idp-cli). One
# npm workspace install at the repo root covers them all. No network, no GitHub
# token, no GCP — the generator is pure and github.ts is mocked in tests.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "idp-core/**"
      - "idp-portal/**"
      - ".github/workflows/node-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
