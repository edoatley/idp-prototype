name: node-checks

# Credential-free checks for the platform's Node surfaces: the shared domain
# (idp-core) and the surfaces built on it (idp-portal, and later idp-cli). One
# npm workspace install at the repo root covers them all. No network, no GitHub
# token, no GCP — the generator is pure and github.ts is mocked in tests.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "idp-core/**"
      - "idp-portal/**"
      - "idp-cli/**"
      - "contracts/**"
      - ".github/workflows/node-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The contract is load-bearing, so it is linted like code. `recommended-strict`
      # means any new problem fails the build; redocly.yaml records the exceptions.
      - run: npm run lint:api

      # The CLI's client types are GENERATED from the contract. Regenerate and
      # diff: a contract change that the client has not followed fails here
      # rather than at runtime in someone's pipeline.
      - name: Contract and generated client are in sync
        run: |
          npm run generate -w idp-cli
          git diff --exit-code -- idp-cli/src/schema.d.ts

      - run: npm run typecheck
      - run: npm test
