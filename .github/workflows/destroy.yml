name: destroy

# Decommission: when a stack directory is REMOVED on merge to main, destroy its
# resources. Runs on the same push as apply.yml but on the disjoint set of
# *deleted* stacks (apply handles added/modified). GitOps-consistent: delete = a
# PR that removes the stack dir.
on:
  push:
    branches: [main]
    paths:
      - "idp-gitops/stacks/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write # to post the decommission audit comment

# Share apply.yml's concurrency group so apply and destroy never race on state.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
      base: ${{ steps.detect.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect removed stacks
        id: detect
        # Also emits `base` — the destroy step below checks the deleted stack
        # out of it to get the config Terraform needs.
        run: .github/scripts/detect-stacks.sh --removed --base '${{ github.event.before }}' --head "$GITHUB_SHA"

  destroy:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform destroy
        id: destroy
        # The stack files are gone on HEAD, so restore them from the parent commit
        # to give Terraform the config (backend + module) it needs to destroy.
        # force_destroy = false: a non-empty bucket fails here loudly (empty first).
        run: |
          git checkout ${{ needs.detect.outputs.base }} -- "${{ matrix.stack }}"
          terraform -chdir=${{ matrix.stack }} init -input=false
          terraform -chdir=${{ matrix.stack }} destroy -auto-approve -input=false

      - name: Comment decommission result on the originating PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-destroy.js`);
            await report({ github, context, core,
              stack: '${{ matrix.stack }}',
              outcome: '${{ steps.destroy.outcome }}' });

