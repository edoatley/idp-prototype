name: portal-checks

# Credential-free checks for the thin portal: typecheck + unit tests. No network,
# no GitHub token, no GCP — the generator is pure and github.ts is mocked in tests.
on:
  pull_request:
    paths:
      - "idp-portal/**"
      - ".github/workflows/portal-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idp-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: idp-portal/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
