name: terraform-checks

# Credential-free static checks + mock-provider unit tests for all Terraform.
# No cloud access is needed, so this runs on every PR.
on:
  pull_request:
    paths:
      - "idp-bootstrap/**"
      - "idp-gitops/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.15.5"
  TRIVY_VERSION: "0.74.0"
  CONFTEST_VERSION: "0.56.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add new Terraform roots here as later phases introduce them.
        dir:
          - idp-bootstrap
          - idp-gitops/modules/gcs-bucket
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.dir }}

      - name: terraform init (no backend)
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=${{ matrix.dir }} validate

      - name: terraform test (mock provider)
        run: terraform -chdir=${{ matrix.dir }} test

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --chdir=${{ matrix.dir }} --init
          tflint --chdir=${{ matrix.dir }} --format compact

      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" v${TRIVY_VERSION}
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: trivy config (misconfig scan)
        # Honours the repo-root .trivyignore (accepted, documented exceptions).
        run: trivy config --quiet --exit-code 1 --severity LOW,MEDIUM,HIGH,CRITICAL ${{ matrix.dir }}

  # Credential-free unit tests for the policy-as-code gate (Phase 2).
  # Repo-global, so it runs once rather than per Terraform root.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install conftest
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" conftest
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: conftest verify (policy unit tests)
        run: conftest verify --policy idp-gitops/policy
