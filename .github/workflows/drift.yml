name: drift

# Scheduled drift detection: plan every stack and flag any that no longer match
# their Terraform (someone changed a bucket in the console). Drift opens/updates a
# GitHub Issue per stack and writes a job summary — feeding the oversight view.
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"

jobs:
  # Every stack (not just changed ones), unlike apply.yml/pr.yml.
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4

      - name: Enumerate stacks
        id: detect
        run: .github/scripts/detect-stacks.sh --all

  drift:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The default wrapper swallows `terraform plan -detailed-exitcode`'s
          # exit code 2 (drift) — disable it so we see the real exit code.
          terraform_wrapper: false

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform -chdir=${{ matrix.stack }} init -input=false

      - name: terraform plan (detect drift)
        id: plan
        run: |
          set +e
          terraform -chdir=${{ matrix.stack }} plan -detailed-exitcode -no-color -input=false > /tmp/plan.txt 2>&1
          code=$?
          cat /tmp/plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # -detailed-exitcode: 0 = no drift, 2 = drift, 1 = real error.
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Report drift
        if: always()
        # Writes the job summary and opens/updates/closes this stack's
        # 'Drift: <stack>' Issue — the signal the portal's compliance panel reads.
        uses: actions/github-script@v7
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-drift.js`);
            await report({ github, context, core,
              stack: '${{ matrix.stack }}',
              exitCode: '${{ steps.plan.outputs.exitcode }}' });

