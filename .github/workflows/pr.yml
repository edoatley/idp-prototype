name: pr

# Plan changed stacks on a PR and post the plan back as a comment.
# Authenticates to GCP with keyless Workload Identity Federation (no SA keys):
# `plan` is read-only but still needs auth because the GCS backend reads state.
on:
  pull_request:
    paths:
      - "idp-gitops/stacks/**"

# Least privilege: request an OIDC token (id-token) for WIF and allow commenting.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.5"

jobs:
  # Emit a JSON array of the stack directories touched by this PR.
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        # Three-dot diff: what this branch changed, ignoring whatever main
        # gained after the branch was cut.
        run: .github/scripts/detect-stacks.sh --changed --merge-base --base '${{ github.event.pull_request.base.sha }}'

  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform fmt
        run: terraform -chdir=${{ matrix.stack }} fmt -check

      - name: terraform init
        run: terraform -chdir=${{ matrix.stack }} init -input=false

      - name: terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=${{ matrix.stack }} plan -no-color -input=false -out=tfplan 2>&1 | tee /tmp/plan.txt
          code=${PIPESTATUS[0]}
          # Machine-readable plan for the policy gate below.
          terraform -chdir=${{ matrix.stack }} show -json tfplan > /tmp/plan.json || true
          exit "$code"

      - uses: ./.github/actions/setup-conftest
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: policy gate (conftest)
        id: policy
        # Independent compliance check on the plan JSON. A deny exits non-zero,
        # fails this job, and blocks the merge — regardless of how the stack was
        # authored (module or raw resource).
        run: |
          set +e
          conftest test /tmp/plan.json --policy idp-gitops/policy --no-color 2>&1 | tee /tmp/policy.txt
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Comment plan on PR
        if: always()
        # Sticky '<!-- tf-plan:<stack> -->' comment: the plan output plus the
        # policy verdict, so the reviewer sees both without opening the run.
        uses: actions/github-script@v7
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-plan.js`);
            await report({ github, context, core,
              stack: '${{ matrix.stack }}',
              planOutcome: '${{ steps.plan.outcome }}',
              policyOutcome: '${{ steps.policy.outcome }}' });

