name: pr

# Plan changed stacks on a PR and post the plan back as a comment.
# Authenticates to GCP with keyless Workload Identity Federation (no SA keys):
# `plan` is read-only but still needs auth because the GCS backend reads state.
on:
  pull_request:
    paths:
      - "idp-gitops/stacks/**"

# Least privilege: request an OIDC token (id-token) for WIF and allow commenting.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.5"
  CONFTEST_VERSION: "0.56.0"

jobs:
  # Emit a JSON array of the stack directories touched by this PR.
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # A stack is idp-gitops/stacks/<env>/<name> (4 path segments).
          mapfile -t dirs < <(git diff --name-only "${base}...HEAD" -- 'idp-gitops/stacks/' \
            | awk -F/ 'NF>=4 {print $1"/"$2"/"$3"/"$4}' | sort -u)
          stacks=()
          for d in "${dirs[@]}"; do
            if [ -f "$d/main.tf" ]; then stacks+=("$d"); fi   # ignore deletions / non-stack files
          done
          if [ ${#stacks[@]} -eq 0 ]; then
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
          else
            echo "stacks=$(printf '%s\n' "${stacks[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed stacks: ${stacks[*]:-none}"

  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform fmt
        run: terraform -chdir=${{ matrix.stack }} fmt -check

      - name: terraform init
        run: terraform -chdir=${{ matrix.stack }} init -input=false

      - name: terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=${{ matrix.stack }} plan -no-color -input=false -out=tfplan 2>&1 | tee /tmp/plan.txt
          code=${PIPESTATUS[0]}
          # Machine-readable plan for the policy gate below.
          terraform -chdir=${{ matrix.stack }} show -json tfplan > /tmp/plan.json || true
          exit $code

      - name: install conftest
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" conftest
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: policy gate (conftest)
        id: policy
        # Independent compliance check on the plan JSON. A deny exits non-zero,
        # fails this job, and blocks the merge — regardless of how the stack was
        # authored (module or raw resource).
        run: |
          set +e
          conftest test /tmp/plan.json --policy idp-gitops/policy --no-color 2>&1 | tee /tmp/policy.txt
          code=${PIPESTATUS[0]}
          exit $code

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stack = '${{ matrix.stack }}';
            const outcome = '${{ steps.plan.outcome }}';
            const policyOutcome = '${{ steps.policy.outcome }}';
            const marker = `<!-- tf-plan:${stack} -->`;
            const read = (p, fallback) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return fallback; } };
            const max = 60000;
            let plan = read('/tmp/plan.txt', 'No plan output captured.');
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated)';
            const policy = read('/tmp/policy.txt', 'Policy gate did not run (plan failed).');
            const policyLabel = policyOutcome === 'success' ? '✅ PASS'
              : policyOutcome === 'failure' ? '❌ FAIL — merge blocked'
              : '⏭️ skipped';
            const body = [
              marker,
              `### Terraform plan — \`${stack}\` (${outcome})`,
              '<details><summary>plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `### Policy gate — ${policyLabel}`,
              '<details><summary>conftest output</summary>',
              '',
              '```',
              policy,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
